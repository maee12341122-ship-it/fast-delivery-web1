<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="فاست ديليفري تعز - FAST Delivery Taiz">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FAST Delivery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>فاست ديليفري تعز | FAST Delivery</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0C0E;
      overflow: hidden;
    }

    body > a[href*="netlify"],
    body > div[style*="position: fixed"][style*="bottom"],
    body > iframe[style*="bottom"],
    a[href*="netlify.com/?utm_campaign=cta"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    function hideNetlifyBadge() {
      const targets = document.querySelectorAll('body > a, body > div, body > iframe');
      targets.forEach((el) => {
        if (el.tagName === 'FLT-GLASS-PANE') return;
        const text = (el.innerText || '').toLowerCase();
        const href = (el.getAttribute('href') || '').toLowerCase();
        const id = (el.id || '').toLowerCase();
        const cls = (el.className || '').toString().toLowerCase();
        const styleAttr = (el.getAttribute('style') || '').toLowerCase();

        const isFixedBottom =
          styleAttr.includes('position: fixed') && styleAttr.includes('bottom');

        if (
          text.includes('netlify') ||
          href.includes('netlify') ||
          id.includes('netlify') ||
          cls.includes('netlify') ||
          isFixedBottom
        ) {
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('opacity', '0', 'important');
          el.style.setProperty('pointer-events', 'none', 'important');
          el.style.setProperty('visibility', 'hidden', 'important');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', hideNetlifyBadge);
    window.addEventListener('load', hideNetlifyBadge);
    setInterval(hideNetlifyBadge, 600);

    const badgeObserver = new MutationObserver(hideNetlifyBadge);
    badgeObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  </script>
</body>
</html>
